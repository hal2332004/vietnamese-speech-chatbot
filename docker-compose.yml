version: '3.9'

services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  chabot-app:
    build: .
    env_file:
      - .env
    environment:
      - HF_HOME=/workspace/hf_cache
    volumes:
      - ${HF_CACHE_DIR:-chatbot_cache}:/workspace/hf_cache
    container_name: chatbot_service
    depends_on:
      - qdrant
    ports:
      - "5500:5500"
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
volumes:
  qdrant_data:
  chatbot_cache: