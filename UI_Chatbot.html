<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #000;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background: rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-title h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .chat-actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 80%;
            animation: fadeIn 0.3s ease;
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message.assistant {
            align-self: flex-start;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .avatar.user {
            background: #fff;
            color: #000;
        }

        .avatar.assistant {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .message-content {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px;
            line-height: 1.5;
            position: relative;
        }

        .message.user .message-content {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .message-content:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .audio-message {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            margin-bottom: 8px;
        }

        .audio-icon {
            width: 24px;
            height: 24px;
            background: rgba(59, 130, 246, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
        }

        .audio-info {
            flex: 1;
        }

        .audio-name {
            font-weight: 500;
            font-size: 14px;
        }

        .audio-size {
            font-size: 12px;
            opacity: 0.7;
        }

        .input-container {
            padding: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.02);
        }

        .input-section {
            max-width: 800px;
            margin: 0 auto;
        }

        .audio-upload-section {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        .audio-upload-btn {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid rgba(59, 130, 246, 0.4);
            color: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .audio-upload-btn:hover {
            background: rgba(59, 130, 246, 0.3);
            border-color: rgba(59, 130, 246, 0.6);
        }

        .upload-info {
            flex: 1;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
        }

        .text-input-section {
            position: relative;
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .input-field {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            resize: none;
            outline: none;
            min-height: 44px;
            max-height: 120px;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.08);
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .send-btn {
            background: #fff;
            color: #000;
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .send-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: translateY(-1px);
        }

        .send-btn:disabled {
            background: rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            transform: none;
        }

        .file-input {
            display: none;
        }

        .welcome-message {
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            padding: 40px 20px;
        }

        .welcome-message h2 {
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .welcome-message p {
            font-size: 16px;
            line-height: 1.5;
        }

        .processing-message {
            display: flex;
            align-items: center;
            gap: 8px;
            font-style: italic;
            opacity: 0.7;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 2px;
        }

        .typing-dot {
            width: 4px;
            height: 4px;
            background: currentColor;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

            /* Responsive */
            @media (max-width: 768px) {
                .message {
                    max-width: 95%;
                }
                
                .input-section {
                    margin: 0 10px;
                }
                
                .chat-container {
                    padding: 15px;
                }

                .audio-upload-section {
                    flex-direction: column;
                    align-items: flex-start;
                    gap: 8px;
                }

                .audio-upload-btn {
                    align-self: stretch;
                    justify-content: center;
                }
            }
    </style>
</head>
<body>
    <div class="chat-header">
        <div class="chat-title">
            <div class="status-indicator"></div>
            <h1>🎙️ Voice Assistant</h1>
        </div>
        <div class="chat-actions">
            <button class="action-btn" id="clearBtn">Xóa</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer">
        <div class="welcome-message">
            <h2>Chào mừng đến với Voice Assistant</h2>
            <p>Tải lên file âm thanh của bạn để bắt đầu cuộc trò chuyện.<br>
            Tôi sẽ chuyển đổi giọng nói thành text và phản hồi lại bạn.</p>
        </div>
    </div>

    <div class="input-container">
        <div class="input-section">
            <!-- Audio Upload Section -->
            <div class="audio-upload-section">
                <button class="audio-upload-btn" id="audioUploadBtn">
                    🎵 Tải File Âm Thanh
                </button>
                <div class="upload-info" id="uploadInfo">
                    Chọn file âm thanh (MP3, WAV, M4A) để tải lên
                </div>
                <input type="file" id="audioFile" class="file-input" accept="audio/*">
            </div>

            <!-- Text Input Section -->
            <div class="text-input-section">
                <textarea 
                    class="input-field" 
                    id="messageInput"
                    placeholder="Hoặc nhập tin nhắn text ở đây..."
                    rows="1"
                ></textarea>
                <button class="send-btn" id="sendBtn" disabled>
                    <svg  xmlns="http://www.w3.org/2000/svg" width={24} height={24} fill={"currentColor"}  viewBox="0 0 24 24" {...props} >
                        <path d="M13 18V9.91l3.29 3.3 1.42-1.42L12 6.09l-5.71 5.7 1.42 1.42L11 9.91V18z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        let conversation = [];
        let isProcessing = false;

        // Elements
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const audioUploadBtn = document.getElementById('audioUploadBtn');
        const audioFile = document.getElementById('audioFile');
        const uploadInfo = document.getElementById('uploadInfo');
        const clearBtn = document.getElementById('clearBtn');

        // Initialize
        updateSendButton();

        // Event listeners
        messageInput.addEventListener('input', () => {
            updateSendButton();
            autoResize();
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                if (!sendBtn.disabled) {
                    sendMessage();
                }
            }
        });

        sendBtn.addEventListener('click', sendMessage);
        audioUploadBtn.addEventListener('click', () => audioFile.click());
        audioFile.addEventListener('change', handleAudioUpload);
        clearBtn.addEventListener('click', clearConversation);

        function updateSendButton() {
            const hasContent = messageInput.value.trim().length > 0;
            sendBtn.disabled = !hasContent || isProcessing;
        }

        function autoResize() {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 120) + 'px';
        }

        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || isProcessing) return;

            addMessage('user', content);
            messageInput.value = '';
            updateSendButton();
            autoResize();


        }

        function handleAudioUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('audio/')) {
                alert('Vui lòng chọn file âm thanh hợp lệ');
                return;
            }

            // Update upload info
            uploadInfo.textContent = `📁 ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB) - Đã chọn`;
            uploadInfo.style.color = '#22c55e';

            // Create audio message
            const audioHTML = `
                <div class="audio-message">
                    <div class="audio-icon">🎵</div>
                    <div class="audio-info">
                        <div class="audio-name">${file.name}</div>
                        <div class="audio-size">${(file.size / 1024 / 1024).toFixed(2)} MB</div>
                    </div>
                </div>
                <div class="processing-message">
                    <span>Đang xử lý âm thanh</span>
                    <div class="typing-indicator">
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                        <div class="typing-dot"></div>
                    </div>
                </div>
            `;

            addMessage('user', audioHTML);

            audioFile.value = '';
            uploadInfo.textContent = 'Chọn file âm thanh (MP3, WAV, M4A) để tải lên';
            uploadInfo.style.color = 'rgba(255, 255, 255, 0.7)';
        }


        function processAudioFile(file) {

        function getAIResponse(text) {

        }


        function textToSpeech(text) {

        }

        function addMessage(type, content) {
            // Remove welcome message if it exists
            const welcome = document.querySelector('.welcome-message');
            if (welcome) {
                welcome.remove();
            }

            const message = {
                type: type,
                content: content,
                timestamp: new Date().toISOString()
            };
            
            conversation.push(message);
            
            const messageElement = document.createElement('div');
            messageElement.className = `message ${type}`;
            messageElement.innerHTML = `
                <div class="avatar ${type}">
                    ${type === 'user' ? 'U' : 'AI'}
                </div>
                <div class="message-content">
                    ${content}
                </div>
            `;
            
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function clearConversation() {
            if (confirm('Bạn có chắc muốn xóa toàn bộ cuộc trò chuyện?')) {
                conversation = [];
                chatContainer.innerHTML = `
                    <div class="welcome-message">
                        <h2>Chào mừng đến với Voice Assistant</h2>
                        <p>Tải lên file âm thanh của bạn để bắt đầu cuộc trò chuyện.<br>
                        Tôi sẽ chuyển đổi giọng nói thành text và phản hồi lại bạn.</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
