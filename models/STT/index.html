<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Thu âm và STT với Gemini</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
    }
    #textResult {
      margin-top: 30px;
      padding: 10px;
      border: 1px solid #ccc;
      width: 60%;
      margin-left: auto;
      margin-right: auto;
    }
  </style>
</head>
<body>

  <h1>Thu âm và trích xuất văn bản</h1>
  <label for="modelSelect"><b>Chọn model Gemini:</b></label>
  <select id="modelSelect">
    <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite</option>
    <option value="gemini-2.0-flash">gemini-2.0-flash</option>
    <option value="gemini-2.5-flash-lite-preview-06-17" selected>gemini-2.5-flash-lite-preview-06-17</option>
  </select>
  <br>
  <button id="startBtn">🎙️ Bắt đầu thu</button>
  <button id="stopBtn" disabled>⏹️ Dừng</button>

  <div id="textResult"><strong>Kết quả:</strong> <span id="resultText">Chưa có dữ liệu</span></div>

  <script>
    let mediaRecorder;
    let audioChunks = [];

    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const resultText = document.getElementById('resultText');
    const modelSelect = document.getElementById('modelSelect');

    startBtn.onclick = async () => {
      audioChunks = [];
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = e => {
        audioChunks.push(e.data);
      };

      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
        const formData = new FormData();
        formData.append("file", audioBlob, "recording.wav");
        formData.append("model", modelSelect.value);

        resultText.innerText = "Đang xử lý...";

        try {
          const response = await fetch("http://localhost:12345/stt", {
            method: "POST",
            body: formData
          });

          const data = await response.json();
          resultText.innerText = data.text || "Không có kết quả.";
        } catch (error) {
          resultText.innerText = "Lỗi khi gọi API: " + error.message;
        }
      };

      mediaRecorder.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
    };
  </script>

</body>
</html>
